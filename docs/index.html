<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单建地下室整体抗浮计算</title>
<style>
  :root { --bd:#d0d7de; --mut:#57606a; --pri:#1f6feb; --bg:#f6f8fa; }
  * { box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",system-ui,sans-serif; margin:0; color:#1f2328; background:var(--bg); }
  header { background:#24292f; color:#fff; padding:12px 20px; font-size:18px; font-weight:600; display:flex; align-items:center; }
  .wrap { max-width:1280px; margin:16px auto; padding:0 16px; display:grid; grid-template-columns:minmax(560px,1fr) minmax(480px,1fr); gap:16px; align-items:start; }
  @media (max-width:960px){ .wrap{ grid-template-columns:1fr; } }
  fieldset { border:1px solid var(--bd); border-radius:8px; background:#fff; margin:0 0 14px; padding:10px 14px 14px; }
  legend { font-weight:600; color:var(--mut); padding:0 6px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px 14px; }
  .fld { display:flex; flex-direction:column; }
  .fld label { font-size:12px; color:var(--mut); margin-bottom:3px; }
  .fld input, .fld select { padding:6px 8px; border:1px solid var(--bd); border-radius:6px; font-size:14px; width:100%; }
  .fld input:focus, .fld select:focus { outline:2px solid #a8c7ff; border-color:var(--pri); }
  .bar { position:sticky; bottom:0; display:flex; gap:10px; align-items:center; padding:12px 14px; background:#fff; border:1px solid var(--bd); border-radius:8px; }
  button { padding:8px 18px; border:1px solid var(--bd); border-radius:6px; background:#f6f8fa; font-size:14px; cursor:pointer; }
  button.primary { background:var(--pri); color:#fff; border-color:var(--pri); }
  button:hover { filter:brightness(.96); }
  .side { position:sticky; top:12px; }
  .kv { display:flex; gap:24px; align-items:center; background:#fff; border:1px solid var(--bd); border-radius:8px; padding:12px 16px; margin-bottom:12px; }
  .kv .val { font-size:22px; font-weight:700; }
  .pass { color:#1a7f37; } .fail { color:#cf222e; }
  #jisuanshu { width:100%; height:calc(100vh - 180px); min-height:360px; font-family:Consolas,"Courier New",monospace; font-size:13px; line-height:1.6; padding:14px; border:1px solid var(--bd); border-radius:8px; background:#fff; resize:vertical; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; }
  .hidden { display:none; }
  .who { margin-left:auto; font-size:13px; color:#cfe0f5; display:flex; gap:10px; align-items:center; }
  .who button { padding:3px 10px; font-size:12px; }
  #auth-mask { position:fixed; inset:0; background:rgba(15,20,30,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .auth-card { background:#fff; border-radius:12px; width:min(400px,92vw); padding:22px 24px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .auth-card h2 { margin:0 0 4px; font-size:19px; }
  .auth-card .sub { margin:0 0 16px; font-size:12px; color:var(--mut); }
  .auth-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .auth-tabs button { flex:1; padding:8px; border:1px solid var(--bd); background:#f6f8fa; border-radius:6px; cursor:pointer; font-size:14px; }
  .auth-tabs button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  .auth-card .row { margin-bottom:10px; }
  .auth-card .row label { display:block; font-size:12px; color:var(--mut); margin-bottom:3px; }
  .auth-card .row input { width:100%; padding:8px 10px; border:1px solid var(--bd); border-radius:6px; font-size:14px; }
  .auth-msg { min-height:18px; font-size:13px; margin:6px 0 12px; }
  .auth-msg.err { color:#cf222e; } .auth-msg.ok { color:#1a7f37; }
  .auth-actions { display:flex; flex-direction:column; gap:8px; }
  .auth-actions .pri { padding:9px; border:none; border-radius:6px; background:var(--pri); color:#fff; font-size:15px; cursor:pointer; }
  .auth-actions .lnk { background:none; border:none; color:var(--pri); cursor:pointer; font-size:13px; padding:2px; }
  .auth-guest { margin-top:12px; padding-top:12px; border-top:1px solid var(--bd); text-align:center; }
  .auth-guest button { width:100%; padding:8px; border:1px solid var(--bd); border-radius:6px; background:#fff; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<header>单建地下室整体抗浮计算　<span style="font-size:13px;font-weight:400;opacity:.8">（网页版 · 与桌面版同一算法）</span>
  <span class="who" id="who"></span>
</header>
<div class="wrap">
  <div>
    <fieldset><legend>工程信息</legend>
      <div class="grid">
        <div class="fld"><label>工程名称</label><input id="gongchengmingcheng" type="text" placeholder="必填"></div>
        <div class="fld"><label>验算区域</label><input id="quyu" type="text" placeholder="如 A~C轴"></div>
        <div class="fld"><label>地下室层数</label><select id="cengshu"><option value="">请选择</option><option>1层</option><option>2层</option><option>3层</option></select></div>
        <div class="fld"><label>抗浮设计等级</label><select id="kangfudengji"><option value="">请选择</option><option>甲级</option><option>乙级</option><option>丙级</option></select></div>
        <div class="fld"><label>验算区域x向长度(m)</label><input id="quyux" type="text" inputmode="decimal"></div>
        <div class="fld"><label>验算区域y向长度(m)</label><input id="quyuy" type="text" inputmode="decimal"></div>
      </div>
    </fieldset>
    <fieldset><legend>整体参数</legend><div class="grid" id="g-OVERALL"></div></fieldset>
    <fieldset><legend>基础</legend><div class="grid" id="g-FOUND"></div></fieldset>
    <fieldset><legend>-1层构件</legend><div class="grid" id="g-F1"></div></fieldset>
    <fieldset id="s-F2" class="hidden"><legend>-2层构件</legend><div class="grid" id="g-F2"></div></fieldset>
    <fieldset id="s-F3" class="hidden"><legend>-3层构件</legend><div class="grid" id="g-F3"></div></fieldset>
    <div class="bar">
      <button class="primary" id="btn-calc">计算</button>
      <button id="btn-clear">清除</button>
      <button id="btn-save">保存计算书(.txt)</button>
      <span id="status" style="color:var(--mut);font-size:13px;margin-left:auto"></span>
    </div>
  </div>
  <div class="side">
    <div class="kv"><span>抗浮稳定安全系数：<span class="val" id="bizhi"></span></span><span id="jielun"></span></div>
    <textarea id="jisuanshu" readonly tabindex="-1" oncontextmenu="return false" placeholder="计算结果与计算书将显示在此处"></textarea>
  </div>
</div>

<!-- 登录 / 游客 遮罩层 -->
<div id="auth-mask" class="hidden">
  <div class="auth-card">
    <h2>欢迎使用抗浮计算</h2>
    <p class="sub">登录后可导出计算书；游客可试用全部计算功能。</p>
    <div class="auth-tabs">
      <button id="tab-login" class="on">登录</button>
      <button id="tab-signup">注册</button>
    </div>
    <div id="pane-login">
      <div class="row"><label>手机号</label><input id="a-phone" type="text" inputmode="numeric" maxlength="11" placeholder="注册时填写的手机号"></div>
      <div class="row"><label>密码</label><input id="a-pass" type="password" placeholder="登录密码"></div>
      <div class="row hidden" id="row-forgot-email"><label>绑定邮箱（用于找回密码）</label><input id="a-forgot-email" type="text" inputmode="email" placeholder="注册时预留的邮箱"></div>
      <div class="auth-msg" id="auth-msg"></div>
      <div class="auth-actions">
        <button class="pri" id="btn-do-login">登 录</button>
        <button class="lnk" id="btn-forgot">忘记密码</button>
      </div>
    </div>
    <div id="pane-signup" class="hidden">
      <div class="row"><label>手机号（作为登录用户名）</label><input id="r-phone" type="text" inputmode="numeric" maxlength="11"></div>
      <div class="row"><label>邮箱（用于找回密码）</label><input id="r-email" type="text" inputmode="email"></div>
      <div class="row"><label>设置密码（至少 6 位）</label><input id="r-pass" type="password"></div>
      <div class="row"><label>确认密码</label><input id="r-pass2" type="password"></div>
      <div class="auth-msg" id="auth-msg2"></div>
      <div class="auth-actions">
        <button class="pri" id="btn-do-signup">注 册</button>
      </div>
    </div>
    <div class="auth-guest"><button id="btn-guest">以游客身份进入（不能导出计算书）</button></div>
  </div>
</div>

<script src="config.js"></script>
<script src="kangfu.js"></script>
<script src="auth.js"></script>
<script>
const $ = id=>document.getElementById(id);
const ALL_FIELDS = [...OVERALL, ...FOUND, ...F1, ...F2, ...F3];

function unitOf(f){
  if(f.name.includes('容重')) return '(kN/m³)';
  if(/标高|厚|宽|长度/.test(f.name)) return '(m)';
  return '';
}
function buildGrid(elId, list){
  $(elId).innerHTML = list.map(f=>
    `<div class="fld"><label>${f.name}${unitOf(f)}</label>`+
    `<input id="${f.id}" type="text" inputmode="${/shu$|shuliang/.test(f.id)?'numeric':'decimal'}" autocomplete="off"></div>`
  ).join('');
}
buildGrid('g-OVERALL', OVERALL);
buildGrid('g-FOUND', FOUND);
buildGrid('g-F1', F1);
buildGrid('g-F2', F2);
buildGrid('g-F3', F3);

// 默认值与桌面版 Form1.Designer.cs 逐项一致（清除后变空白，与桌面版"清除"行为相同）
const DEFAULTS = {
  gongchengmingcheng:'请在此处输入工程名称(只影响计算书内容，不影响计算结果)',
  quyu:'如：1轴-2轴交A轴-B轴',
  quyux:'8.1', quyuy:'8.1',
  shuiwei:'-2.0', dibandibiaogao:'-10.0', tongrongzhong:'25',
  yidingbanbiaogao:'-1.5', erdingbanbiaogao:'-4.5', sandingbanbiaogao:'-7.5',
  fuyidingbanhou:'0.25', fuerdingbanhou:'0.25', fusandingbanhou:'0.25',
  dibanhoudu:'0.4',
  fuyidingbanfutuhou:'1.5', fuerdingbanfutuhou:'0.05', fusandingbanfutuhou:'0.05',
  dibanfutuhou:'0.05',
  fuyidingbanfuturongzhong:'20', fuerdingbanfuturongzhong:'22', fusandingbanfuturongzhong:'22',
  dibanfuturongzhong:'22',
  jichuhou:'1', jichuchang:'3', jichukuan:'3', jichushuliang:'1',
  fuyixzhuliangkuan:'0.4', fuyixzhulianggao:'0.9', fuyixzhuliangshu:'1',
  fuyiyzhuliangkuan:'0.4', fuyiyzhulianggao:'0.9', fuyiyzhuliangshu:'1',
  fuyixciliangkuan:'0.3', fuyixcilianggao:'0.8', fuyixciliangshu:'2',
  fuyiyciliangkuan:'0.3', fuyiycilianggao:'0.8', fuyiyciliangshu:'2',
  fuyizhuchang:'0.6', fuyizhukuan:'0.6', fuyizhushu:'1',
  fuerxzhuliangkuan:'0.4', fuerxzhulianggao:'0.9', fuerxzhuliangshu:'1',
  fueryzhuliangkuan:'0.4', fueryzhulianggao:'0.9', fueryzhuliangshu:'1',
  fuerxciliangkuan:'0.3', fuerxcilianggao:'0.8', fuerxciliangshu:'2',
  fueryciliangkuan:'0.3', fuerycilianggao:'0.8', fueryciliangshu:'2',
  fuerzhuchang:'0.6', fuerzhukuan:'0.6', fuerzhushu:'1',
  fusanxzhuliangkuan:'0.4', fusanxzhulianggao:'0.9', fusanxzhuliangshu:'1',
  fusanyzhuliangkuan:'0.4', fusanyzhulianggao:'0.9', fusanyzhuliangshu:'1',
  fusanxciliangkuan:'0.3', fusanxcilianggao:'0.8', fusanxciliangshu:'2',
  fusanyciliangkuan:'0.3', fusanycilianggao:'0.8', fusanyciliangshu:'2',
  fusanzhuchang:'0.6', fusanzhukuan:'0.6', fusanzhushu:'1'
};
for(const k in DEFAULTS){ const el=$(k); if(el) el.value=DEFAULTS[k]; }

function updateFloorVisibility(){
  const cs=$('cengshu').value;
  $('s-F2').classList.toggle('hidden', !(cs==='2层'||cs==='3层'));
  $('s-F3').classList.toggle('hidden', !(cs==='3层'));
}
let lastCengVal='';
$('cengshu').addEventListener('change', ()=>{
  const cs=$('cengshu').value;
  if(window.KangfuAuth && KangfuAuth.isGuest() && (cs==='2层'||cs==='3层')){
    alert('游客不能计算2层、3层地下室，请先登录或注册。');
    $('cengshu').value=lastCengVal;
    updateFloorVisibility();
    return;
  }
  lastCengVal=cs;
  updateFloorVisibility();
});

// 计算书展示框：只读、不可选中、不可复制，仅供查看。
(function guardJisuanshu(){
  const box = $('jisuanshu');
  const block = e => { e.preventDefault(); return false; };
  box.addEventListener('copy', block);
  box.addEventListener('cut', block);
  box.addEventListener('select', block);
  box.addEventListener('mousedown', ()=>{ if(box.selectionStart!==null) box.setSelectionRange(0,0); });
  box.addEventListener('keydown', e=>{
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && ['a','c','x'].includes((e.key||'').toLowerCase())) e.preventDefault();
  });
})();

function showResult(bizhi, jielun, jss){
  $('bizhi').textContent = bizhi;
  const jr=$('jielun');
  jr.textContent = jielun;
  jr.className = jielun.includes('满足抗浮要求') ? 'pass' : (jielun ? 'fail' : '');
  $('jisuanshu').value = jss;
}
function clearResult(){ $('bizhi').textContent=''; $('jielun').textContent=''; $('jielun').className=''; $('jisuanshu').value=''; }

$('btn-calc').addEventListener('click', ()=>{
  const raw={}; ALL_FIELDS.forEach(f=>raw[f.id]=$(f.id).value);
  raw.quyux=$('quyux').value; raw.quyuy=$('quyuy').value;
  const r = runFromRaw(raw, $('cengshu').value, $('kangfudengji').value,
                          $('gongchengmingcheng').value, $('quyu').value);
  if(r.alert){ clearResult(); $('status').textContent=''; alert(r.alert); return; }
  showResult(r.bizhi, r.jielun, r.jss);
  $('status').textContent='计算完成';
});

$('btn-clear').addEventListener('click', ()=>{
  ALL_FIELDS.forEach(f=>$(f.id).value='');
  $('gongchengmingcheng').value=''; $('quyu').value='';
  $('quyux').value=''; $('quyuy').value='';
  $('cengshu').value=''; $('kangfudengji').value='';
  updateFloorVisibility(); clearResult(); $('status').textContent='';
});

$('btn-save').addEventListener('click', ()=>{
  if(window.KangfuAuth && KangfuAuth.isGuest()){
    alert('游客不能导出计算书，请先登录或注册。');
    showAuthMask();
    return;
  }
  const txt=$('jisuanshu').value;
  if(!txt){ alert('请先计算，暂无可保存的内容！'); return; }
  const name=$('gongchengmingcheng').value.trim()||'抗浮计算书';
  const blob=new Blob([''+txt], {type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name+'-整体抗浮计算书.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  $('status').textContent='已下载';
});
</script>
<script>
// ---------- 登录 / 游客 遮罩层交互 ----------
function showAuthMask(){ $('auth-mask').classList.remove('hidden'); }
function hideAuthMask(){ $('auth-mask').classList.add('hidden'); }
function authMsg(text, ok){ const m=$('auth-msg'); m.textContent=text; m.className='auth-msg '+(text?(ok?'ok':'err'):''); }
function signupMsg(text, ok){ const m=$('auth-msg2'); m.textContent=text; m.className='auth-msg '+(text?(ok?'ok':'err'):''); }
function switchTab(t){
  $('tab-login').classList.toggle('on', t==='login');
  $('tab-signup').classList.toggle('on', t==='signup');
  $('pane-login').classList.toggle('hidden', t!=='login');
  $('pane-signup').classList.toggle('hidden', t!=='signup');
  authMsg(''); signupMsg('');
  if(t==='login') resetForgot();
}
const PHONE_RE=/^1\d{10}$/, EMAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
let forgotMode=false;
function resetForgot(){
  forgotMode=false;
  const row=$('row-forgot-email'); if(row) row.classList.add('hidden');
  const em=$('a-forgot-email'); if(em) em.value='';
  const btn=$('btn-forgot'); if(btn) btn.textContent='忘记密码';
}
function refreshWho(){
  const s=KangfuAuth.state();
  const who=$('who');
  if(s.guest){ who.innerHTML='<span style="opacity:.85">游客</span><button id="btn-login-open">登录/注册</button>'; }
  else { who.innerHTML='<span style="opacity:.85">'+((s.user&&s.user.phone)||'已登录')+'</span><button id="btn-logout">退出</button>'; }
  const b1=$('btn-logout'); if(b1) b1.onclick=()=>KangfuAuth.logout();
  const b2=$('btn-login-open'); if(b2) b2.onclick=showAuthMask;
}
KangfuAuth.onChange(refreshWho);

$('btn-do-login').addEventListener('click', async ()=>{
  authMsg('登录中…', true);
  try{ await KangfuAuth.login($('a-phone').value.trim(), $('a-pass').value); hideAuthMask(); }
  catch(e){ authMsg(e.message); }
});
$('btn-do-signup').addEventListener('click', async ()=>{
  const phone=$('r-phone').value.trim(), email=$('r-email').value.trim();
  const p1=$('r-pass').value, p2=$('r-pass2').value;
  if(!PHONE_RE.test(phone)){ signupMsg('请输入 11 位手机号。'); return; }
  if(!EMAIL_RE.test(email)){ signupMsg('请输入正确的邮箱。'); return; }
  if(p1.length<6){ signupMsg('密码至少 6 位。'); return; }
  if(p1!==p2){ signupMsg('两次输入的密码不一致。'); return; }
  signupMsg('注册中…', true);
  try{
    const r=await KangfuAuth.signup(phone, email, p1);
    if(r.needConfirm){ switchTab('login'); authMsg('注册成功，请到邮箱确认后登录。', true); }
    else hideAuthMask();
  }catch(e){ signupMsg(e.message); }
});
// 忘记密码：两步——先校验手机号并显示邮箱框，再校验绑定邮箱一致后发送
$('btn-forgot').addEventListener('click', async ()=>{
  if(!forgotMode){
    const phone=$('a-phone').value.trim();
    if(!PHONE_RE.test(phone)){ authMsg('请先在手机号栏输入已注册的手机号。'); return; }
    forgotMode=true;
    $('row-forgot-email').classList.remove('hidden');
    $('btn-forgot').textContent='发送重置邮件';
    authMsg('请输入注册时绑定的邮箱，然后点击"发送重置邮件"。', true);
    $('a-forgot-email').focus();
    return;
  }
  const phone=$('a-phone').value.trim();
  const email=$('a-forgot-email').value.trim();
  if(!EMAIL_RE.test(email)){ authMsg('请输入正确的邮箱。'); return; }
  authMsg('校验并发送中…', true);
  try{
    const bound=await KangfuAuth.lookupEmail(phone);
    if(!bound){ authMsg('该手机号未注册。'); return; }
    if(String(bound).trim().toLowerCase()!==email.toLowerCase()){ authMsg('邮箱与该手机号绑定的不一致，无法发送重置邮件。'); return; }
    await KangfuAuth.recover(bound);
    resetForgot();
    authMsg('重置邮件已发送，请查收。', true);
  }catch(e){ authMsg(e.message); }
});
$('btn-guest').addEventListener('click', hideAuthMask);
$('tab-login').addEventListener('click', ()=>switchTab('login'));
$('tab-signup').addEventListener('click', ()=>switchTab('signup'));
refreshWho();
if(KangfuAuth.isGuest()) showAuthMask(); else hideAuthMask();
</script>
</body>
</html>
